<nav class="sidebar">

  <!-- ========== SEARCH + TOOLS ========== -->
  <div class="sidebar-toolbar">
    <div class="search-wrap">
      <i class="bi bi-search search-icon"></i>
      <input type="text"
             class="search-input"
             [(ngModel)]="search"
             (ngModelChange)="onSearchChange()"
             placeholder="Search menu…"
             autocomplete="off">
      <button class="search-clear"
              *ngIf="search"
              (click)="clearSearch()"
              title="Clear">
        <i class="bi bi-x"></i>
      </button>
    </div>

    <div class="toolbar-actions">
      <button class="tool-btn"
              (click)="collapseAll()"
              title="Collapse all">
        <i class="bi bi-chevron-bar-up"></i>
      </button>
      <button class="tool-btn"
              (click)="expandAll()"
              title="Expand all">
        <i class="bi bi-chevron-bar-down"></i>
      </button>
    </div>
  </div>

  <!-- ========== GROUPS ========== -->
  <ng-container *ngFor="let g of visibleGroups; trackBy: trackGroup">
    <div class="nav-group"
         [class.nav-group-operations]="g.accent === 'operations'">

      <button class="nav-group-title" (click)="toggleGroup(g.id)">
        <div class="d-flex align-items-center title-left">
          <i class="bi me-2" [ngClass]="g.icon"></i>
          <span class="title-text">{{ g.title }}</span>
        </div>
        <div class="d-flex align-items-center gap-1">
          <span class="item-count" *ngIf="search">{{ g.items.length }}</span>
          <i class="bi" [ngClass]="isOpen(g.id) ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </div>
      </button>

      <ul class="nav-group-list" [class.open]="isOpen(g.id)">
        <li *ngFor="let item of g.items; trackBy: trackItem">
          <a [routerLink]="item.route"
             routerLinkActive="active"
             class="nav-link">
            <i class="bi me-2 nav-link-icon"
               *ngIf="item.icon"
               [ngClass]="item.icon"></i>
            <span class="nav-link-text">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </ng-container>

  <!-- Empty-state when search matches nothing -->
  <div class="empty-state" *ngIf="visibleGroups.length === 0">
    <i class="bi bi-search me-1"></i>
    No items match "{{ search }}"
  </div>

</nav>
